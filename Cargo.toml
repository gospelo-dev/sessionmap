[package]
name = "gospelo-sessionmap"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "TUI that lists coding-agent sessions (Claude Code, OpenCode, Copilot, Codex) with memory, idle time and context size, so you can find and free the stranded ones"
repository = "https://github.com/gospelo-dev/sessionmap"
readme = "README.md"
keywords = ["tui", "monitor", "claude-code", "codex", "copilot"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["assets/", "docs/", ".github/"]

[[bin]]
name = "sessionmap"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.33"
